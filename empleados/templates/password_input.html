{% load crispy_forms_field %}

<div id="div_{{ field.id_for_label }}" class="form-group mb-3 {% if field.errors %}invalid{% endif %}">
    <label for="{{ field.id_for_label }}" class="form-label {% if field.field.required %}required{% endif %}">
        {{ field.label }}
        {% if field.field.required %}<span class="asteriskField">*</span>{% endif %}
    </label>
    <div class="input-group">
        <input type="{{ field.widget_type }}" name="{{ field.html_name }}" id="{{ field.id_for_label }}"
               class="form-control {% if field.errors %}is-invalid{% endif %}"
               {% if field.value %}value="{{ field.value }}"{% endif %}
               {% if field.field.required %}required{% endif %}
               placeholder="{{ field.field.widget.attrs.placeholder|default_if_none:'' }}"
               {% if field.field.max_length %}maxlength="{{ field.field.max_length }}"{% endif %}
               aria-describedby="{{ field.id_for_label }}-helptext">
        <button type="button" class="btn btn-outline-secondary toggle-password" data-target="{{ field.id_for_label }}">
            <i class="fas fa-eye"></i>
        </button>
        {% if field.errors %}
            <div class="invalid-feedback">
                {% for error in field.errors %}
                    {{ error }}
                {% endfor %}
            </div>
        {% endif %}
    </div>
    {% if field.help_text %}
        <small id="{{ field.id_for_label }}-helptext" class="form-text text-muted">
            {{ field.help_text|safe }}
        </small>
    {% endif %}
</div>
